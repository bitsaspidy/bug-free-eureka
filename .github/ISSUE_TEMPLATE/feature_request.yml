name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities do not go here.** Report them privately: see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: I checked that this does not require the core package to import a framework.
          required: true
        - label: I understand the owner decides scope and merges.
          required: true
