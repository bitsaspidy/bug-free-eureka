<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Bug-Free Eureka</title>
  <desc id="d">Open-source API security toolkit for Node.js and Express. Find risks. Fix configurations. Build with confidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1010" cy="300" r="260" fill="url(#glow)"/>

  <!-- shield with check -->
  <g transform="translate(890 150)">
    <path d="M120 0 L240 44 V150 C240 236 186 290 120 316 C54 290 0 236 0 150 V44 Z" fill="url(#shield)"/>
    <path d="M120 22 L218 58 V150 C218 222 174 268 120 292 C66 268 22 222 22 150 V58 Z" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M70 158 L106 194 L176 118" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- terminal-style findings card -->
  <g transform="translate(820 500)" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18">
    <rect width="380" height="86" rx="10" fill="#0f172a" stroke="#1e3a5f"/>
    <text x="20" y="34" fill="#94a3b8"># <tspan fill="#e2e8f0">rule results</tspan></text>
    <text x="20" y="64" fill="#4ade80">pass</text>
    <text x="78" y="64" fill="#f87171">fail</text>
    <text x="134" y="64" fill="#fbbf24">not_assessed</text>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#38bdf8" font-size="22" font-weight="600" letter-spacing="3">OPEN-SOURCE · APACHE-2.0</text>
    <text x="80" y="236" fill="#ffffff" font-size="84" font-weight="800">Bug-Free Eureka</text>
    <text x="80" y="296" fill="#cbd5e1" font-size="32">API security toolkit for Node.js &amp; Express</text>
    <text x="80" y="380" fill="#ffffff" font-size="30" font-weight="600">Find risks. Fix configurations.</text>
    <text x="80" y="422" fill="#ffffff" font-size="30" font-weight="600">Build with confidence.</text>

    <g font-size="20" font-weight="600">
      <rect x="80" y="486" width="140" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text x="150" y="515" fill="#e2e8f0" text-anchor="middle">TypeScript</text>
      <rect x="234" y="486" width="190" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text x="329" y="515" fill="#e2e8f0" text-anchor="middle">Node 22 · 24 · 26</text>
      <rect x="438" y="486" width="116" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text x="496" y="515" fill="#e2e8f0" text-anchor="middle">Express</text>
      <rect x="568" y="486" width="230" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text x="683" y="515" fill="#e2e8f0" text-anchor="middle">Runs inside your app</text>
    </g>
  </g>
</svg>
